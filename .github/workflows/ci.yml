name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microlearning
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/microlearning
      # Role riêng cho get_db() (RLS, migration 881bca16e9bc tự tạo role này
      # lúc `alembic upgrade head` chạy) -- mật khẩu khớp mặc định của
      # migration vì APP_RUNTIME_DB_PASSWORD không set trong CI.
      APP_RUNTIME_DATABASE_URL: postgresql+psycopg://app_runtime:app_runtime_dev_password@localhost:5432/microlearning
      # Role of the background worker (migration a4d7e2c9b6f1), same default password.
      APP_WORKER_DATABASE_URL: postgresql+psycopg://app_worker:app_worker_dev_password@localhost:5432/microlearning
      SECRET_KEY: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      # Ghim dung phien ban chu khong dung tag major nhu hai action kia: astral-sh chi
      # duy tri tag major di dong den v7, con v8 tro len khong co, nen @v10 se khong ton tai.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # The Python of backend/Dockerfile: the tests run on what the image runs.
          python-version: "3.14"
      - run: uv sync
      # docker-compose's db service creates the vector extension via
      # docker/init-pgvector.sql on first boot -- the CI service container
      # has no such init hook, so it's created explicitly here instead.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d microlearning -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run pytest tests/unit tests/integration tests/e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test -- src/test/unit src/test/integration
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TERRAFORM_VERSION: 1.17.1
    steps:
      - uses: actions/checkout@v7
      # Downloaded and checked against HashiCorp's checksums instead of a setup action, so there
      # is no third-party action runtime to keep up to date.
      - run: |
          base=https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION
          curl -fsSLo /tmp/tf.zip "$base/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLo /tmp/tf.sums "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          (cd /tmp && grep linux_amd64 tf.sums | sed 's/terraform_.*\.zip/tf.zip/' | sha256sum -c)
          sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin terraform
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # Plans against a mocked AWS: no account and no cost (tests/plan.tftest.hcl).
      - run: terraform test
      - run: bash -n ../scripts/deploy.sh

  moodle-plugin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Nhánh của Moodle 5.2 mà docker-compose đang chạy; moodle-plugin-ci tải nhánh này về
      # rồi dựng site PHPUnit thử ngay trong job.
      MOODLE_BRANCH: MOODLE_502_STABLE
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo
      - uses: shivammathur/setup-php@v2
        with:
          # Moodle 5.2 đòi PHP 8.3 trở lên.
          php-version: "8.3"
          extensions: pgsql, pdo_pgsql, zip, gd, intl, soap, sodium, xmlrpc, mbstring, xml, curl
          ini-values: max_input_vars=5000
          coverage: none
      # Ghim đúng phiên bản như các job trên: 4.5.x là dòng hỗ trợ Moodle 5.x.
      - run: composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci 4.5.11
      - run: echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
      - run: echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
      # PHPUnit của Moodle đòi locale en_AU.UTF-8, runner Ubuntu không cài sẵn.
      - run: sudo locale-gen en_AU.UTF-8
      - run: moodle-plugin-ci install --plugin ./repo/moodle-plugin/local_lms_bridge --db-host=127.0.0.1
        env:
          DB: pgsql
      - run: moodle-plugin-ci phplint
      - run: moodle-plugin-ci phpunit --fail-on-warning

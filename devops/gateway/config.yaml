# LLM gateway routing (LiteLLM Proxy). The backend asks for an alias
# (LLM_MODEL by default, see backend/app/config.py); this file is the
# only place that says which provider and model an alias means, and the only
# place that reads the provider API keys, from the environment (never write a
# key here). A provider whose key is empty simply cannot be used.
#
# One provider key covers every remote alias: OPENROUTER_API_KEY, billed on one balance
# (Gemini, OpenAI, Anthropic, the open-weight models and Whisper). Only the local embedder
# has a key of its own. Whisper through OpenRouter returns segment timestamps
# (verbose_json), which citations of recordings need; litellm has no OpenRouter
# transcription route, so it is called over the OpenAI protocol with OpenRouter's api_base.
#
# Each OpenRouter alias pins one upstream (provider.order, allow_fallbacks: false), so a
# measurement keeps the provider it was made on and a failure is visible instead of
# silently served elsewhere; data_collection: deny keeps prompts, which carry course
# material, off endpoints that store or train on them.
#
# Model ids are pinned, never "-latest": Google moves a "-latest" alias to each new
# release, so results measured on it could not be reproduced. Gemini is pinned to
# Google AI Studio, the upstream the earlier free-tier results were measured on.
# OpenRouter slugs are listed at https://openrouter.ai/models.
model_list:
  - model_name: transcribe
    litellm_params:
      model: openai/openai/whisper-large-v3-turbo
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: Whisper Large V3 Turbo qua OpenRouter
      mode: audio_transcription

  - model_name: gemini-flash
    litellm_params:
      model: openrouter/google/gemini-3.8-flash
      extra_body:
        provider: {order: [google-ai-studio], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      display_name: Gemini 3.8 Flash
      note: bám nguồn tốt nhất, đắt nhất; đọc được ảnh

  # Embeddings for retrieval (backend/app/ingestion/embeddings.py), served by the `embedder`
  # service of docker-compose.yml rather than a provider: the free Gemini tier embeds only 1000
  # chunks a day, so a course's documents took days, and it retrieved no better, see
  # docs/measurements/2026-09-25-model-nhung.md. Multilingual, so Vietnamese documents are
  # searched properly, and in a container of its own so the backend image stays light.
  # "openai/" only names the protocol the embedder speaks. It returns 1024 numbers but was
  # trained to be cut shorter, so the backend's `dimensions` gives the 768 of chunks.embedding.
  - model_name: embed-default
    litellm_params:
      model: openai/Qwen3-Embedding-0.6B
      api_base: http://embedder:80/v1
      api_key: os.environ/EMBEDDER_API_KEY
      # litellm only lets `dimensions` through for OpenAI models it knows can take it.
      allowed_openai_params: ["dimensions"]
    model_info:
      display_name: Qwen3 Embedding 0.6B (chạy tại chỗ)
      mode: embedding

  # Other embedding models, chosen with EMBEDDING_MODEL. Vectors of two models cannot be
  # compared, so switching means clearing chunks.embedding and running scripts/reembed_chunks.py.
  # The provider cuts its vectors to 768 through the same `dimensions` argument.
  - model_name: embed-openai
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      extra_body:
        provider: {order: [openai], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: OpenAI Embedding 3 Small
      mode: embedding

  - model_name: openai-fast
    litellm_params:
      model: openrouter/openai/gpt-6-luna
      additional_drop_params: [temperature]
      extra_body:
        provider: {order: [openai], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      display_name: GPT-6 Luna
      note: rẻ nhất khi đo, chất lượng ngang nhóm đầu; model sinh mặc định

  - model_name: claude-fast
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5
      additional_drop_params: [temperature]
      extra_body:
        provider: {order: [anthropic], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      display_name: Claude Haiku 5.5
      note: nhanh
  # "deepinfra/fp8" is one endpoint: the bare "deepinfra" also matches DeepInfra's priority tier, at
  # another price (https://openrouter.ai/api/v1/models/deepseek/deepseek-v4.1-flash/endpoints,
  # checked 2026-11-16: structured outputs, $0.14/$0.42 per million tokens).
  - model_name: deepseek-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      extra_body:
        provider: {order: [deepinfra/fp8], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      mode: chat
      display_name: DeepSeek V4.1 Flash
      note: rẻ, bám nguồn tốt; chậm khi viết lời thoại video

# LiteLLM owns retries and failover.
# Generation never falls back to OpenAI, Claude or DeepSeek; gemini-flash is the only fallback target.
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  retry_after: 1
  timeout: 120
  # A cooldown turned one 429 into errors for every job using the model: 1 of 32 modules finished with it,
  # 30 of 32 without it (docs/measurements/2026-11-05-real-llm-and-jev.md). The backend retries a 429.
  disable_cooldowns: true
  enable_pre_call_checks: true
  optional_pre_call_checks: [enforce_model_rate_limits]
  # gemini-flash has no fallback: it is the last resort of the others, the default openai-fast included.
  fallbacks:
    - openai-fast: [gemini-flash]
    - claude-fast: [gemini-flash]
    - deepseek-flash: [gemini-flash]
  context_window_fallbacks:
    - openai-fast: [gemini-flash]
    - claude-fast: [gemini-flash]
    - deepseek-flash: [gemini-flash]

general_settings:
  master_key: os.environ/LLM_GATEWAY_KEY
  # Voice and image models (backend/app/llm/media.py). LiteLLM 1.100.1 has no OpenRouter route
  # for speech, and its image route cannot reach the chat-completions form Nano Banana is served
  # in, so model_list cannot hold them. The brief's fallback is used instead: exactly the three
  # routes media.py calls are forwarded to OpenRouter with the key added here, so the backend
  # still holds no provider key. No include_subpath, so no other OpenRouter route is reachable.
  # auth: true makes the gateway key required (free in this LiteLLM version).
  # /openrouter/chat/completions is NOT pinned at the gateway: any holder of the gateway key can
  # call any OpenRouter chat model through it. Callers must go through media.py, which adds the
  # provider order, allow_fallbacks: false and data_collection: deny to every request.
  pass_through_endpoints:
    - path: /openrouter/audio/speech
      target: https://openrouter.ai/api/v1/audio/speech
      auth: true
      headers:
        Authorization: Bearer os.environ/OPENROUTER_API_KEY
    - path: /openrouter/chat/completions
      target: https://openrouter.ai/api/v1/chat/completions
      auth: true
      headers:
        Authorization: Bearer os.environ/OPENROUTER_API_KEY
    - path: /openrouter/images
      target: https://openrouter.ai/api/v1/images
      auth: true
      headers:
        Authorization: Bearer os.environ/OPENROUTER_API_KEY

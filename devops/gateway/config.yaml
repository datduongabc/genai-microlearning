# LLM gateway routing (LiteLLM Proxy). The backend asks for an alias
# (LLM_MODEL by default, see backend/app/config.py); this file is the
# only place that says which provider and model an alias means, and the only
# place that reads the provider API keys, from the environment (never write a
# key here). A provider whose key is empty simply cannot be used.
#
# Two keys cover every alias. GEMINI_API_KEY: Google's free tier, called directly, since
# OpenRouter has no free Gemini; it also serves the default aliases and embed-gemini.
# OPENROUTER_API_KEY: every paid model (OpenAI, Anthropic, the open-weight models), billed
# on one balance. Transcription stays on Groq (GROQ_API_KEY) until Whisper through
# OpenRouter is measured: it returns segment timestamps only from some upstreams.
#
# Each OpenRouter alias pins one upstream (provider.order, allow_fallbacks: false), so a
# measurement keeps the provider it was made on and a failure is visible instead of
# silently served elsewhere; data_collection: deny keeps prompts, which carry course
# material, off endpoints that store or train on them.
#
# Model ids are pinned, never "-latest": Google moves a "-latest" alias to each new
# release, so results measured on it could not be reproduced. Gemini ids are stable
# models of the free tier (https://ai.google.dev/gemini-api/docs/models); there is no
# stable Pro model on the free tier, so the stronger Gemini alias is Flash. OpenRouter
# slugs are listed at https://openrouter.ai/models.
model_list:
  - model_name: transcribe
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/GROQ_API_KEY
    model_info:
      display_name: Whisper Large V3 Turbo qua Groq
      mode: audio_transcription

  - model_name: gemini-fast
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      display_name: Gemini 3.5 Flash Lite
      note: nhanh, có hạn mức miễn phí
  # The same model as gemini-fast, paid through OpenRouter on Google AI Studio: for when the free
  # daily quota is spent, and for course material that should not reach the free tier, whose
  # prompts Google may use. No fallback: it is chosen on purpose.
  - model_name: gemini-fast-paid
    litellm_params:
      model: openrouter/google/gemini-3.5-flash-lite
      extra_body:
        provider: {order: [google-ai-studio], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: Gemini 3.5 Flash Lite (trả phí)
      note: như Gemini 3.5 Flash Lite, không giới hạn theo ngày
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      display_name: Gemini 3.5 Flash
      note: chất lượng cao hơn, hạn mức miễn phí thấp hơn

  # Embeddings for retrieval (backend/app/ingestion/embeddings.py), served by the `embedder`
  # service of docker-compose.yml rather than a provider: the free Gemini tier embeds only 1000
  # chunks a day, so a course's documents took days, and it retrieved no better, see
  # docs/measurements/2026-09-25-model-nhung.md. Multilingual, so Vietnamese documents are
  # searched properly, and in a container of its own so the backend image stays light.
  # "openai/" only names the protocol the embedder speaks. It returns 1024 numbers but was
  # trained to be cut shorter, so the backend's `dimensions` gives the 768 of chunks.embedding.
  - model_name: embed-default
    litellm_params:
      model: openai/Qwen3-Embedding-0.6B
      api_base: http://embedder:80/v1
      api_key: os.environ/EMBEDDER_API_KEY
      # litellm only lets `dimensions` through for OpenAI models it knows can take it.
      allowed_openai_params: ["dimensions"]
    model_info:
      display_name: Qwen3 Embedding 0.6B (chạy tại chỗ)
      mode: embedding

  # Other embedding models, chosen with EMBEDDING_MODEL. Vectors of two models cannot be
  # compared, so switching means clearing chunks.embedding and running scripts/reembed_chunks.py.
  # The providers cut their vectors to 768 through the same `dimensions` argument. Groq has no
  # embedding model, so it cannot serve here.
  - model_name: embed-gemini
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      display_name: Gemini Embedding
      mode: embedding
  - model_name: embed-openai
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      extra_body:
        provider: {order: [openai], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: OpenAI Embedding 3 Small
      mode: embedding

  - model_name: openai-fast
    litellm_params:
      model: openrouter/openai/gpt-6-luna
      additional_drop_params: [temperature]
      extra_body:
        provider: {order: [openai], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: GPT-6 Luna
      note: nhanh
  - model_name: openai-pro
    litellm_params:
      model: openrouter/openai/gpt-6.1-sol
      additional_drop_params: [temperature]
      extra_body:
        provider: {order: [openai], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: GPT-6.1 Sol
      note: chất lượng cao hơn, chậm hơn

  - model_name: claude-fast
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5
      additional_drop_params: [temperature]
      extra_body:
        provider: {order: [anthropic], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: Claude Haiku 5.5
      note: nhanh
  - model_name: claude-pro
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5.5
      additional_drop_params: [temperature]
      extra_body:
        provider: {order: [anthropic], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: Claude Sonnet 5.5
      note: chất lượng cao hơn, chậm hơn

  # Lecturer opt-in model, served by Groq through OpenRouter; GPT-OSS is not in the judge pool.
  - model_name: groq-pro
    litellm_params:
      model: openrouter/openai/gpt-oss-120b
      reasoning_effort: low
      allowed_openai_params: [reasoning_effort]
      extra_body:
        provider: {order: [groq], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: GPT-OSS 120B qua Groq
      note: trả phí, model sinh tùy chọn
      max_input_tokens: 128000
      max_output_tokens: 2048

  # Evaluation alternatives, on the upstream they were measured on (checked against
  # https://openrouter.ai/api/v1/models/<slug>/endpoints on 2026-11-08).
  - model_name: groq-llama
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      extra_body:
        provider: {order: [groq], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: llama-3.3-70b-versatile qua Groq
      max_input_tokens: 128000

  # Groq does not serve this model through OpenRouter; DeepInfra serves it unquantised (bf16).
  - model_name: groq-qwen
    litellm_params:
      model: openrouter/qwen/qwen3.8-27b
      extra_body:
        provider: {order: [deepinfra], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: qwen/qwen3.8-27b qua DeepInfra
      max_input_tokens: 128000

  - model_name: groq-minimax
    litellm_params:
      model: openrouter/minimax/minimax-m2.7
      extra_body:
        provider: {order: [groq], allow_fallbacks: false, data_collection: deny}
      api_key: os.environ/OPENROUTER_API_KEY
    model_info:
      display_name: minimaxai/minimax-m2.7 qua Groq
      max_input_tokens: 128000

  # Internal small-step profiles keep the same primary model. Only bounded
  # requests use these; Content, Slides and Example use the large-safe aliases.
  - model_name: gemini-fast-small
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      display_name: Gemini (bước nhỏ)
      hidden: true
  - model_name: gemini-flash-small
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      display_name: Gemini (bước nhỏ)
      hidden: true

  # Optional free-tier load balancing across two distinct deployments. The
  # normal default stays gemini-fast; experiments must pick a single-model alias.
  - model_name: gemini-balanced
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      display_name: Gemini cân bằng tải
      note: phân phối giữa Flash Lite và Flash; không dùng cho thí nghiệm
  - model_name: gemini-balanced
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      display_name: Gemini cân bằng tải
      note: phân phối giữa Flash Lite và Flash; không dùng cho thí nghiệm

# LiteLLM owns retries, load balancing and failover.
# OpenAI, Claude and paid Groq are opt-in; generation never falls back to them.
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  retry_after: 1
  timeout: 120
  # A cooldown turned one 429 into errors for every job using the model: 1 of 32 modules finished with it,
  # 30 of 32 without it (docs/measurements/2026-11-05-real-llm-and-jev.md). The backend retries a 429.
  disable_cooldowns: true
  enable_pre_call_checks: true
  optional_pre_call_checks: [enforce_model_rate_limits]
  fallbacks:
    - gemini-fast: [gemini-flash]
    - gemini-flash: [gemini-fast]
    - gemini-fast-small: [gemini-flash-small]
    - gemini-flash-small: [gemini-fast-small]
    - groq-pro: [gemini-fast, gemini-flash]
    - openai-fast: [gemini-fast, gemini-flash]
    - openai-pro: [gemini-fast, gemini-flash]
    - claude-fast: [gemini-fast, gemini-flash]
    - claude-pro: [gemini-fast, gemini-flash]
  context_window_fallbacks:
    - gemini-fast: [gemini-flash]
    - gemini-flash: [gemini-fast]
    - gemini-fast-small: [gemini-fast, gemini-flash]
    - gemini-flash-small: [gemini-flash, gemini-fast]
    - groq-pro: [gemini-fast, gemini-flash]
    - openai-fast: [gemini-fast, gemini-flash]
    - openai-pro: [gemini-fast, gemini-flash]
    - claude-fast: [gemini-fast, gemini-flash]
    - claude-pro: [gemini-fast, gemini-flash]

general_settings:
  master_key: os.environ/LLM_GATEWAY_KEY

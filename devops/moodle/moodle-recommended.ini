; Cac gia tri Moodle 5.x doi hoi/khuyen nghi trong "Environment check" luc
; cai dat va van hanh binh thuong (mac dinh cua PHP image qua thap, vd
; max_input_vars=1000 lam CLI installer bao loi ngay tu buoc dau tien).
max_input_vars = 5000
memory_limit = 256M
max_execution_time = 300
upload_max_filesize = 100M
post_max_size = 100M

; Source Moodle nam tren bind mount tu o Windows: do thuc te 3000 file PHP mat
; ~24s de stat va ~32s de doc, so voi ~0.02s / ~0.12s tren filesystem goc cua
; container. Muc tieu la de PHP khong bao gio stat/doc lai file .php sau lan
; dau, nen:
;  - max_accelerated_files: mac dinh 10000 nho hon so file Moodle nap qua cac
;    trang, cache bi day va compile lai lien tuc.
;  - validate_timestamps=0: mac dinh cu 2s lai stat toan bo file da cache
;    (moi request thu 2s bi cham them ~1-2s). Doi lai, sua file .php (vd
;    plugin local_lms_bridge, git pull Moodle) chi co hieu luc sau
;    `docker restart moodle_app`.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0

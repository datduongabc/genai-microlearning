<!doctype html>
<!-- One slide of a narrated video, 1280x720 CSS pixels. app/video/slides.py fills the placeholders and
     serves the page, the picture and the assets from its own origin; nothing comes from the network. -->
<html lang="$lang">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/katex/katex.min.css">
<script src="assets/katex/katex.min.js"></script>
<style>
:root { --scale: 1; --ink: #13294b; --muted: #5b6b86; --accent: #17b6d6; --line: #c9d3e3; --paper: #f7f8fb; }
html, body { margin: 0; }
body { width: 1280px; height: 720px; overflow: hidden; position: relative; background: var(--paper);
       color: var(--ink); font-family: 'Be Vietnam Pro', sans-serif; }
.bar { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--accent); }
.s { position: absolute; inset: 0; display: flex; gap: 40px; padding: 56px 64px; box-sizing: border-box; }
.t { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
h1 { font-size: calc(44px * var(--scale)); line-height: 1.2; margin: 0 0 calc(28px * var(--scale)); font-weight: 700; }
.title h1 { font-size: calc(56px * var(--scale)); }
ul { margin: 0; padding-left: 28px; font-size: calc(28px * var(--scale)); line-height: 1.5; }
li { margin: calc(6px * var(--scale)) 0; }
.focus li { opacity: .38; }
.focus li.on { opacity: 1; }
.focus li.on::marker { color: var(--accent); }
sub { font-size: 0.7em; line-height: 0; }
.f { margin-top: calc(26px * var(--scale)); font-size: calc(34px * var(--scale)); overflow: hidden; }
.f .katex-display { margin: 0.4em 0; }
.tex-error { font-family: 'JetBrains Mono', monospace; font-size: 0.7em; color: #b42318; }
.d.tex-error { white-space: pre-wrap; font-size: 18px; }
/* On code too: the browser's own `code { font-family: monospace }` would otherwise win, and a system
   monospace font lacks the Vietnamese glyphs ("rỗng" came out as "rôñg"). */
pre, code { font-family: 'JetBrains Mono', monospace; }
pre { margin: calc(22px * var(--scale)) 0 0; padding: 18px 22px; border-radius: 12px; background: #fff;
      box-shadow: 0 2px 14px rgba(19, 41, 75, .08);
      font-size: calc(20px * var(--scale)); line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
table { margin-top: calc(22px * var(--scale)); border-collapse: collapse; font-size: calc(22px * var(--scale)); }
td, th { border: 1px solid var(--line); padding: calc(8px * var(--scale)) 14px; text-align: left; }
th { background: #e6eef9; }
.d { margin-top: calc(22px * var(--scale)); }
/* Mermaid sizes its SVG to the diagram, no wider than its box (width 100%, max-width its own size); capped in height
   too, so a tall one shrinks into the slide instead of being cut off, and a small one is not blown up. */
.d svg { display: block; overflow: visible; max-height: calc(440px * var(--scale)); height: auto; margin: 0 auto; }
.img { flex: 0 0 560px; display: flex; align-items: center; justify-content: center; }
.img img { max-width: 560px; max-height: 520px; padding: 24px; box-sizing: border-box; border-radius: 14px;
           background: #fff; box-shadow: 0 2px 14px rgba(19, 41, 75, .08); }
</style>
</head>
<body class="$layout">
<div class="s $kind"><div class="bar"></div>
<div class="t">$content</div>
$image
</div>
<script>
// Called directly rather than through auto-render: auto-render left formulas unrendered in the trial.
for (const el of document.querySelectorAll('[data-tex]')) {
  try {
    katex.render(el.dataset.tex, el, { displayMode: el.classList.contains('f'), throwOnError: true });
  } catch (err) {
    // The lecturer sees the formula as written, in red, on the preview, instead of a slide that never renders.
    el.textContent = el.dataset.tex;
    el.classList.add('tex-error');
    document.body.dataset.texError = err.message;
  }
}

// Shrinks the text until the column holds it: a lecturer's edit can make a scene longer than the layout.
function overflows() {
  const box = document.querySelector('.t');
  const items = box.children;
  if (!items.length) return false;
  const height = items[items.length - 1].getBoundingClientRect().bottom - items[0].getBoundingClientRect().top;
  const wide = [...box.querySelectorAll('.f, table, pre, .d')].some(e => e.scrollWidth > box.clientWidth + 1);
  return height > box.clientHeight + 1 || wide;
}
function fit() {
  let scale = 1;
  while (overflows() && scale > 0.5) {
    scale = Math.round((scale - 0.05) * 100) / 100;
    document.documentElement.style.setProperty('--scale', scale);
  }
  document.body.dataset.scale = scale;
  document.body.dataset.overflows = overflows() ? '1' : '0';
}

// strict: the diagram comes from a model that read the lecture, so no HTML, script or click handler in it runs.
async function drawDiagrams() {
  const boxes = document.querySelectorAll('[data-mermaid]');
  if (!boxes.length) return;
  // Loaded only here: parsing its 5 MB took most of a second on every slide, diagram or not.
  await new Promise((done, fail) => {
    const script = document.createElement('script');
    script.src = 'assets/mermaid/mermaid.min.js';
    script.onload = done;
    script.onerror = () => fail(new Error('Mermaid did not load'));
    document.head.appendChild(script);
  });
  const font = "'Be Vietnam Pro', sans-serif";
  mermaid.initialize({
    startOnLoad: false, securityLevel: 'strict', suppressErrorRendering: true, theme: 'base', fontFamily: font,
    themeVariables: {
      // Near the bullets' 28px, so a diagram reads like the slide around it at its own size.
      fontFamily: font, fontSize: '26px', primaryColor: '#e6eef9', primaryBorderColor: '#13294b',
      primaryTextColor: '#13294b', lineColor: '#5b6b86', secondaryColor: '#d6f4fa', tertiaryColor: '#ffffff',
      edgeLabelBackground: '#f7f8fb',
      xyChart: { backgroundColor: '#f7f8fb', plotColorPalette: '#17b6d6, #13294b, #5b6b86, #9fd8e6',
                 titleColor: '#13294b', xAxisLabelColor: '#13294b', yAxisLabelColor: '#13294b',
                 xAxisTitleColor: '#13294b', yAxisTitleColor: '#13294b', xAxisLineColor: '#5b6b86', yAxisLineColor: '#5b6b86' },
    },
    gantt: { fontSize: 18, sectionFontSize: 18, barHeight: 34, barGap: 10, topPadding: 30, leftPadding: 110, useWidth: 1100,
             gridLineStartPadding: 50 },
    sequence: { width: 180, height: 60 },
    xyChart: { width: 1000, height: 430, titleFontSize: 22, xAxis: { labelFontSize: 18, titleFontSize: 18 },
               yAxis: { labelFontSize: 16, titleFontSize: 18 } },
    // The gantt axis takes its size from CSS, and its numbers sat under the last row's bar.
    themeCSS: '.tick text { font-size: 16px; fill: #13294b; } .grid .tick text { transform: translateY(14px); } '
      + '.sectionTitle { font-size: 18px; } .messageText, text.actor, text.actor > tspan { font-size: 22px !important; }',
  });
  let n = 0;
  for (const box of boxes) {
    try {
      const { svg } = await mermaid.render('diagram-' + n++, box.dataset.mermaid);
      box.innerHTML = svg;
      // d3 restarts its every-few-days gantt ticks on each month's 1st, putting 31/01 a day before
      // 01/02 so the two labels overlap; a label closer than 12px to the one before it is left out.
      let end = -Infinity;
      for (const label of box.querySelectorAll('.grid .tick text')) {
        const { left, right } = label.getBoundingClientRect();
        if (left < end + 12) label.style.display = 'none'; else end = right;
      }
    } catch (err) {
      // As a formula: the lecturer sees the code in red on the preview, instead of a slide that never renders.
      box.textContent = box.dataset.mermaid;
      box.classList.add('tex-error');
      document.body.dataset.diagramError = String((err && err.message) || err);
    }
  }
}

(async () => {
  const text = document.body.innerText;
  // Fonts load only once text needs them, and document.fonts.ready does not wait for a load that
  // has not started yet, so each face is asked for with the slide's own text first.
  await Promise.all(['400 28px "Be Vietnam Pro"', '700 44px "Be Vietnam Pro"', '400 20px "JetBrains Mono"']
    .map(font => document.fonts.load(font, text).catch(() => null)));
  await Promise.all([...document.images].map(img => img.decode().catch(() => null)));
  await document.fonts.ready;
  // After the fonts, so Mermaid measures its labels in the font they are drawn in.
  try {
    await drawDiagrams();
  } catch (err) {
    document.body.dataset.diagramError = String((err && err.message) || err);
  }
  fit();
  await document.fonts.ready;
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
